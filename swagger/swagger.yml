openapi: 3.0.0
info:
  title: DIAN API
  version: 1.0.0
  description: API para la gestión de facturas electrónicas
  contact:
    name: CYT

servers:
  - url: http://localhost:4000
    description: Servidor local

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

security:
  - bearerAuth: []

paths:
  /auth/token:
    post:
      summary: Iniciar sesión y obtener un token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                usuario:
                  type: string
                  example: "usuario123"
                clave:
                  type: string
                  example: "clave123"
      responses:
        '200':
          description: Token generado exitosamente
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: integer
                    example: 200
                  message:
                    type: string
                    example: "Autenticado"
                  data:
                    type: string
                    example: "token_jwt"
        '400':
          description: Campos requeridos faltantes
        '500':
          description: Error al iniciar sesión

  /facturas:
    post:
      summary: Crear una nueva factura
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                clienteNombre:
                  type: string
                  example: "Juan Perez"
                clienteDocumento:
                  type: string
                  example: "123456789"
                Lote:
                  type: string
                  example: "42343242334"
                CUFE:
                  type: string
                  example: "ABC123456789"
                nombreEmisor:
                  type: string
                  example: "Empresa Emisora"
                nitEmisor:
                  type: string
                  example: "987654321"
                nombreReceptor:
                  type: string
                  example: "Empresa Receptora"
                nitReceptor:
                  type: string
                  example: "123456789"
                fechaEmision:
                  type: string
                  format: date
                  example: "2025-03-12"
                folio:
                  type: string
                  example: "001"
                serie:
                  type: string
                  example: "A"
                IVA:
                  type: string
                  example: "19.00"
                total:
                  type: string
                  example: "1000.00"
                PDF:
                  type: string
                  format: base64
                  example: "UEsFBgAAAAAAAAAAAAAAAAAAAAAAAA=="
                acuses:
                  type: object
                  properties:
                    "030":
                      type: boolean
                      example: true
                    "031":
                      type: boolean
                      example: true
                    "032":
                      type: boolean
                      example: true
                    "033":
                      type: boolean
                      example: false
      responses:
        '200':
          description: Factura creada correctamente
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: integer
                    example: 200
                  message:
                    type: string
                    example: "Factura creada correctamente."
                  data:
                    type: object
        '400':
          description: Campos requeridos faltantes
        '500':
          description: Error al crear la factura

  /facturas/reporte:
    post:
      summary: Generar un reporte de facturas para varios lotes
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                lotes:
                  type: array
                  items:
                    type: string
                  example: ["20250619232635", "20250620090158"]
                tipoRespuesta:
                  type: string
                  enum: [descarga, base64]
                  example: descarga
                  description: Tipo de respuesta deseada (descarga o base64)
      responses:
        '200':
          description: Reporte generado correctamente
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: integer
                    example: 200
                  message:
                    type: string
                    example: "Reporte generado correctamente."
                  data:
                    type: object
                    properties:
                      excelBase64:
                        type: string
                        example: "UEsFBgAAAAAAAAAAAAAAAAAAAAAAAA=="
        '400':
          description: Parámetros requeridos faltantes
        '500':
          description: Error al generar el reporte

  /facturas/faltantes:
    get:
      summary: Consultar facturas faltantes comparando reportes con facturas
      description: Obtiene la lista de CUFE/batch que están en la tabla reportes pero no han sido procesados como facturas
      responses:
        '200':
          description: Consulta de facturas faltantes realizada correctamente
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: integer
                    example: 200
                  message:
                    type: string
                    example: "Facturas faltantes consultadas correctamente."
                  data:
                    type: object
                    properties:
                      totalMissing:
                        type: integer
                        example: 15
                        description: Número total de facturas faltantes
                      records:
                        type: array
                        items:
                          type: object
                          properties:
                            cufeCude:
                              type: string
                              example: "ABC123456789XYZ"
                              description: CUFE/CUDE de la factura
                            batch:
                              type: string
                              example: "20251009142530"
                              description: Lote de la factura
                            folio:
                              type: string
                              example: "001"
                              description: Folio de la factura
                            issuerName:
                              type: string
                              example: "Empresa Emisora SA"
                              description: Nombre del emisor
                            receiverName:
                              type: string
                              example: "Empresa Receptora SA"
                              description: Nombre del receptor
                            total:
                              type: number
                              example: 1500.50
                              description: Valor total de la factura
        '500':
          description: Error al consultar facturas faltantes

  /facturas/faltantes/siguiente:
    get:
      summary: Obtener la siguiente factura pendiente para procesar
      description: Retorna UNA factura pendiente del sistema de cola. Marca automáticamente como asignada y maneja timeouts de 5 minutos. Diseñado para RPAs que procesan de una en una.
      responses:
        '200':
          description: Siguiente factura pendiente obtenida correctamente
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: integer
                    example: 200
                  message:
                    type: string
                    example: "Siguiente factura pendiente obtenida correctamente."
                  data:
                    type: object
                    properties:
                      id:
                        type: integer
                        example: 1234
                        description: ID del reporte
                      cufeCude:
                        type: string
                        example: "ABC123456789XYZ"
                        description: CUFE/CUDE de la factura
                      batch:
                        type: string
                        example: "20251014142530"
                        description: Lote de la factura
                      folio:
                        type: string
                        example: "001"
                        description: Folio de la factura
                      clientName:
                        type: string
                        example: "CYT"
                        description: Nombre del cliente
                      clientDocument:
                        type: string
                        example: "900620176"
                        description: Documento del cliente
                      issuerName:
                        type: string
                        example: "Empresa Emisora SA"
                        description: Nombre del emisor
                      issuerNit:
                        type: string
                        example: "987654321"
                        description: NIT del emisor
                      receiverName:
                        type: string
                        example: "Empresa Receptora SA"
                        description: Nombre del receptor
                      receiverNit:
                        type: string
                        example: "123456789"
                        description: NIT del receptor
                      total:
                        type: number
                        example: 1500.50
                        description: Valor total de la factura
                      vat:
                        type: number
                        example: 285.10
                        description: Valor del IVA
                      issueDate:
                        type: string
                        format: date
                        example: "2025-10-14"
                        description: Fecha de emisión
        '404':
          description: No hay facturas pendientes por procesar
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: integer
                    example: 404
                  message:
                    type: string
                    example: "No hay facturas pendientes por procesar."
        '500':
          description: Error al obtener siguiente factura pendiente

  /facturas/lotes:
    get:
      summary: Obtener resumen de todos los lotes
      description: Obtiene un listado de todos los lotes con estadísticas de procesamiento ordenados por fecha más reciente
      responses:
        '200':
          description: Resumen de lotes obtenido correctamente
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: integer
                    example: 200
                  message:
                    type: string
                    example: "Resumen de lotes obtenido correctamente."
                  data:
                    type: object
                    properties:
                      totalBatches:
                        type: integer
                        example: 5
                        description: Número total de lotes
                      batches:
                        type: array
                        items:
                          type: object
                          properties:
                            batch:
                              type: string
                              example: "20251009142530"
                              description: Identificador del lote
                            clientName:
                              type: string
                              example: "CYT"
                              description: Nombre del cliente
                            clientDocument:
                              type: string
                              example: "900620176"
                              description: Documento del cliente
                            totalRecords:
                              type: integer
                              example: 100
                              description: Total de registros en el lote
                            processedRecords:
                              type: integer
                              example: 75
                              description: Registros procesados como facturas
                            pendingRecords:
                              type: integer
                              example: 20
                              description: Registros pendientes por procesar
                            assignedRecords:
                              type: integer
                              example: 5
                              description: Registros asignados a RPAs
                            progressPercentage:
                              type: number
                              example: 75.00
                              description: Porcentaje de progreso del lote
                            creationDate:
                              type: string
                              format: date-time
                              example: "2025-10-09T14:25:30.000Z"
                              description: Fecha de creación del lote
        '500':
          description: Error al obtener resumen de lotes

  /reportes/upload:
    post:
      summary: Subir archivo Excel con reportes DIAN
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                excel:
                  type: string
                  format: binary
                  description: Archivo Excel con la estructura de reportes DIAN (.xlsx, .xls, .csv)
                clienteNombre:
                  type: string
                  default: "CYT"
                  example: "CYT"
                  description: Nombre del cliente (por defecto CYT)
                clienteDocumento:
                  type: string
                  default: "900620176"
                  example: "900620176"
                  description: Documento del cliente (por defecto 900620176)
              required:
                - excel
      responses:
        '201':
          description: Archivo procesado correctamente
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: integer
                    example: 201
                  message:
                    type: string
                    example: "Se procesaron 5 registros y se insertaron 5 correctamente"
                  data:
                    type: object
                    properties:
                      totalProcessed:
                        type: integer
                        example: 5
                      totalInserted:
                        type: integer
                        example: 5
                      batch:
                        type: string
                        example: "20251009142530"
        '400':
          description: Archivo Excel requerido o formato inválido
        '413':
          description: Archivo demasiado grande (límite 50MB)
        '500':
          description: Error al procesar el archivo Excel

